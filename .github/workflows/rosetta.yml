name: Translate README

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Languages come from [tool.readme-rosetta] in pyproject.toml.
      - uses: ./
        with:
          backend: ${{ secrets.ANTHROPIC_API_KEY != '' && 'anthropic' || 'ollama' }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          extra-args: --jobs 4
