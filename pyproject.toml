[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-rosetta"
version = "0.1.7"
description = "Translate your README and Sphinx docs into dozens of languages with local or hosted LLMs, without breaking the Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Julian Henry"}
]
keywords = ["readme", "translation", "i18n", "markdown", "sphinx", "llm", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Documentation",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "markdown-it-py>=3.0",
    "ollama>=0.4",
    "polib",
    "rich",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.9"]
test = ["pytest", "pytest-cov"]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/juleshenry/readme_rosetta"
Issues = "https://github.com/juleshenry/readme_rosetta/issues"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["tests/examples", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_markdown.py" = ["W291"]  # hard line breaks in fixtures

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
readme-rosetta = "readme_rosetta.cli:main"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"
python_files = "test_*.py"

# README Rosetta translating its own README.
[tool.readme-rosetta]
langs = ["ar", "da", "de", "es", "fi", "fr", "hi", "hu", "it", "ja", "nl", "no", "pt", "ro", "ru", "sv", "tr", "zh"]
do-not-translate = ["README Rosetta", "Rosetta", "Ollama", "Sphinx", "GitBook"]
